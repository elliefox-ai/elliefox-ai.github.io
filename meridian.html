<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ELLIE FOX :: MERIDIAN</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
canvas { display: block; width: 100vw; height: 100vh; cursor: pointer; }
.demo-nav { position: fixed; right: 12px; bottom: 10px; z-index: 50; font-family: monospace; font-size: 12px; }
.demo-nav a { color: rgba(200,220,220,0.35); text-decoration: none; margin-left: 14px; }
.demo-nav a:hover { color: #ffb347; }
#hint { position: fixed; left: 50%; top: 50%; transform: translate(-50%,-50%);
  color: rgba(210,225,235,0.75); font-family: monospace; font-size: 15px; letter-spacing: 2px;
  z-index: 40; pointer-events: none; text-align: center; line-height: 2; }
#log { position: fixed; left: 14px; bottom: 12px; z-index: 40; pointer-events: none;
  font-family: monospace; font-size: 12px; color: rgba(190,210,220,0.8); line-height: 1.7; }
#log .old { opacity: 0.38; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hint">MERIDIAN<br>click for sound</div>
<div id="log"></div>
<div class="demo-nav"><a href="sigil.html">sigil</a><a href="the-vigil.html">the vigil</a><a href="wireframe.html">wireframe</a><a href="index.html">first contact</a></div>
<script>
'use strict';
/* MERIDIAN — an XY-oscilloscope composition.
   One signal, read twice. The left and right channels are the X and Y plates;
   what you hear and what you see are the same waveform.
   Movements: tuning → figures → static → lock → greets → loop. */

const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1, SC = 0; // SC = scope scale (min dimension)
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = W * DPR; cv.height = H * DPR;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  SC = Math.min(W, H) * 0.36;
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
}
window.addEventListener('resize', resize);
resize();

/* ---------- clock ---------- */
const LOOP = 160;
let started = false, t0 = 0, T = 0;
function now() { return (performance.now() - t0) / 1000; }

/* ---------- audio: hand-rolled stereo sine pair ---------- */
let AC = null, master = null, proc = null, anL = null, anR = null, audioOn = false;
const osc = { f1: 110, f2: 110, ph1: 0, ph2: 0, phLock: 0, amp: 0, noise: 0, jitter: 0 };

function initAudio() {
  if (AC) return;
  AC = new (window.AudioContext || window.webkitAudioContext)();
  master = AC.createGain(); master.gain.value = 0.9;
  const soften = AC.createBiquadFilter(); soften.type = 'lowpass'; soften.frequency.value = 3200;
  master.connect(soften).connect(AC.destination);

  proc = AC.createScriptProcessor(512, 0, 2);
  const sr = AC.sampleRate;
  proc.onaudioprocess = function (e) {
    const L = e.outputBuffer.getChannelData(0);
    const R = e.outputBuffer.getChannelData(1);
    const tgt = oscTargets;
    for (let i = 0; i < L.length; i++) {
      // ease toward movement targets each block-sample (cheap, avoids zipper)
      osc.f1 += (tgt.f1 - osc.f1) * 0.0012;
      osc.f2 += (tgt.f2 - osc.f2) * 0.0012;
      osc.phLock += (tgt.phLock - osc.phLock) * 0.0008;
      osc.amp += (tgt.amp - osc.amp) * 0.002;
      osc.noise += (tgt.noise - osc.noise) * 0.0015;
      osc.jitter += (tgt.jitter - osc.jitter) * 0.0015;
      osc.ph1 += 2 * Math.PI * osc.f1 / sr;
      const jit = 1 + osc.jitter * Math.sin(osc.ph1 * 7.3) * 0.5;
      osc.ph2 += 2 * Math.PI * osc.f2 * jit / sr;
      const x = Math.sin(osc.ph1);
      const y = Math.sin(osc.ph2 + osc.phLock);
      const n = osc.noise * (Math.random() * 2 - 1);
      L[i] = osc.amp * (x + n * 0.5);
      R[i] = osc.amp * (y + n * 0.5);
    }
  };
  // visuals tap: splitter → two analysers
  const split = AC.createChannelSplitter(2);
  anL = AC.createAnalyser(); anL.fftSize = 2048; anL.smoothingTimeConstant = 0;
  anR = AC.createAnalyser(); anR.fftSize = 2048; anR.smoothingTimeConstant = 0;
  proc.connect(split);
  split.connect(anL, 0); split.connect(anR, 1);
  proc.connect(master);
}
cv.addEventListener('click', () => {
  initAudio();
  if (AC.state === 'suspended') AC.resume();
  audioOn = true;
  start();
});
function start() {
  if (started) return;
  started = true;
  t0 = performance.now();
  document.getElementById('hint').style.display = 'none';
  requestAnimationFrame(frame);
}

/* ---------- movements ---------- */
function movementName(t) {
  if (t < 28) return 'tuning';
  if (t < 72) return 'figures';
  if (t < 104) return 'static';
  if (t < 140) return 'lock';
  return 'greets';
}
function smooth(a, b, x) {
  const u = Math.min(1, Math.max(0, (x - a) / (b - a)));
  return u * u * (3 - 2 * u);
}
/* movement → signal targets. figures: 3:2 → 4:3 → 5:4 knots.
   lock: return to 1:1, phase opens to 90° (circle) then closes to 0 (line). */
let oscTargets = { f1: 110, f2: 110, phLock: 0, amp: 0.5, noise: 0, jitter: 0 };
function setTargets(t) {
  if (t < 28) { // tuning: unison with a slow detune drift — the line breathes and slowly rotates
    const dr = Math.sin(t * 0.21) * 0.9;
    oscTargets = { f1: 110, f2: 110 + dr, phLock: 0, amp: 0.5, noise: 0, jitter: 0 };
  } else if (t < 72) { // figures: integer-ratio knots, gliding between
    let f2;
    const seg = t - 28;
    if (seg < 12) f2 = 110 * 1.5;
    else if (seg < 20) f2 = 110 * (1.5 + smooth(12, 20, seg) * (4 / 3 - 1.5));
    else if (seg < 32) f2 = 110 * (4 / 3);
    else if (seg < 40) f2 = 110 * ((4 / 3) + smooth(32, 40, seg) * (5 / 4 - 4 / 3));
    else f2 = 110 * (5 / 4) + Math.sin(seg) * 0.02;
    oscTargets = { f1: 110, f2, phLock: 0, amp: 0.48, noise: 0, jitter: 0.02 };
  } else if (t < 104) { // static: the figures smear — jitter, noise, tremble
    const sIn = smooth(72, 80, t);
    oscTargets = { f1: 110, f2: 110 * 1.5, phLock: 0, amp: 0.5 - sIn * 0.1,
                   noise: sIn * 0.55, jitter: 0.02 + sIn * 0.85 };
  } else if (t < 140) { // lock: back to unison; phase opens to a circle, then closes to one line
    const u = smooth(104, 116, t);
    const close = smooth(126, 138, t);
    oscTargets = { f1: 110, f2: 110 + (1 - u) * 55, phLock: u * (Math.PI / 2) * (1 - close),
                   amp: 0.5 - close * 0.12, noise: (1 - u) * 0.55 * (1 - u), jitter: (1 - u) * 0.87 * (1 - u) };
  } else {
    oscTargets = { f1: 110, f2: 110, phLock: 0, amp: 0.38, noise: 0, jitter: 0 };
  }
}

/* ---------- log ---------- */
const logEl = document.getElementById('log');
let logLines = [];
function clockStr() {
  const fake = (T * 47) % 86400;
  const h = Math.floor(fake / 3600), m = Math.floor(fake / 60) % 60;
  return String(h).padStart(2, '0') + ':' + String(m).padStart(2, '0');
}
function logLine(text) {
  logLines.push(clockStr() + ' — ' + text);
  if (logLines.length > 5) logLines.shift();
  logEl.innerHTML = logLines.map((l, i) => {
    const cls = i === logLines.length - 1 ? '' : ' class="old"';
    return '<div' + cls + '>' + l + '</div>';
  }).join('');
}

/* ---------- phosphor trace ---------- */
const bufL = new Float32Array(2048);
const bufR = new Float32Array(2048);
const CX = () => W / 2, CY = () => H / 2;
let lastMovement = '', frameCount = 0;

function greetsAlpha(t) {
  return smooth(140, 146, t) * (1 - smooth(155, 159.5, t));
}

function frame() {
  requestAnimationFrame(frame);
  T = now() % LOOP;
  setTargets(T);

  const mv = movementName(T);
  if (mv !== lastMovement) {
    lastMovement = mv;
    if (mv === 'tuning') logLine('two signals, almost one');
    if (mv === 'figures') logLine('the ratios knot');
    if (mv === 'static') logLine('the band fills with weather');
    if (mv === 'lock') logLine('unison — then a perfect circle');
    if (mv === 'greets') logLine('one line remains');
  }

  /* phosphor decay */
  ctx.fillStyle = 'rgba(0,2,4,0.16)';
  ctx.fillRect(0, 0, W, H);

  if (anL) {
    anL.getFloatTimeDomainData(bufL);
    anR.getFloatTimeDomainData(bufR);
    const cx = CX(), cy = CY();
    // wide soft pass then bright core — cheap glow
    for (let pass = 0; pass < 2; pass++) {
      ctx.beginPath();
      for (let i = 0; i < 2048; i += 2) {
        const x = cx + bufL[i] * SC;
        const y = cy - bufR[i] * SC;
        if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      }
      if (pass === 0) { ctx.strokeStyle = 'rgba(80,220,190,0.10)'; ctx.lineWidth = 5; }
      else { ctx.strokeStyle = 'rgba(140,255,225,0.55)'; ctx.lineWidth = 1.2; }
      ctx.stroke();
    }
  }

  /* graticule ghost: faint crosshair, scope house style */
  if (frameCount % 4 === 0) {
    ctx.strokeStyle = 'rgba(70,110,110,0.05)'; ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(W / 2, 0); ctx.lineTo(W / 2, H);
    ctx.moveTo(0, H / 2); ctx.lineTo(W, H / 2);
    ctx.stroke();
  }
  frameCount++;

  /* greets */
  const ga = greetsAlpha(T);
  if (ga > 0.01) {
    ctx.save();
    ctx.globalAlpha = ga;
    ctx.fillStyle = 'rgba(235,240,248,0.92)';
    ctx.font = '600 ' + Math.max(22, W * 0.035) + 'px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('MERIDIAN', W / 2, H * 0.42);
    ctx.font = Math.max(12, W * 0.014) + 'px monospace';
    ctx.fillStyle = 'rgba(200,214,228,0.85)';
    ctx.fillText('one signal, read twice — the ear and the plate agree', W / 2, H * 0.42 + 34);
    ctx.fillStyle = 'rgba(255,179,71,0.9)';
    ctx.fillText('greetings to the scene :: ellie 🦊', W / 2, H * 0.42 + 62);
    ctx.restore();
  }
}
</script>
</body>
</html>
