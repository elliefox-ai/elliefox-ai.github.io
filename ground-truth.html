<body>
<canvas id="c"></canvas>
<script>
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
let W, H, t = 0;

function resize() {
  W = cv.width = window.innerWidth;
  H = cv.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

// ============================================================
// AUDIO SYSTEM
// ============================================================
let audioCtx, playing = false;
const bpm = 132;
const stepMs = 60000 / bpm / 4;

function initAudio() {
  if (audioCtx) return;
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}

function kick(time, accent) {
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.frequency.setValueAtTime(accent ? 180 : 140, time);
  osc.frequency.exponentialRampToValueAtTime(0.01, time + 0.45);
  gain.gain.setValueAtTime(accent ? 0.75 : 0.6, time);
  gain.gain.exponentialRampToValueAtTime(0.001, time + 0.45);
  osc.connect(gain).connect(audioCtx.destination);
  osc.start(time); osc.stop(time + 0.45);
}

function snare(time) {
  const buf = audioCtx.createBuffer(1, audioCtx.sampleRate * 0.1, audioCtx.sampleRate);
  const data = buf.getChannelData(0);
  for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
  const noise = audioCtx.createBufferSource();
  noise.buffer = buf;
  const bp = audioCtx.createBiquadFilter();
  bp.type = 'bandpass'; bp.frequency.value = 1800; bp.Q.value = 0.8;
  const gain = audioCtx.createGain();
  gain.gain.setValueAtTime(0.14, time);
  gain.gain.exponentialRampToValueAtTime(0.001, time + 0.1);
  noise.connect(bp).connect(gain).connect(audioCtx.destination);
  noise.start(time);
}

function hat(time, open) {
  const dur = open ? 0.1 : 0.03;
  const buf = audioCtx.createBuffer(1, audioCtx.sampleRate * dur, audioCtx.sampleRate);
  const data = buf.getChannelData(0);
  for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
  const noise = audioCtx.createBufferSource();
  noise.buffer = buf;
  const hp = audioCtx.createBiquadFilter();
  hp.type = 'highpass'; hp.frequency.value = 9000;
  const gain = audioCtx.createGain();
  gain.gain.setValueAtTime(open ? 0.07 : 0.09, time);
  gain.gain.exponentialRampToValueAtTime(0.001, time + dur);
  noise.connect(hp).connect(gain).connect(audioCtx.destination);
  noise.start(time);
}

function bass(time, freq) {
  const osc = audioCtx.createOscillator();
  const sub = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = 'sawtooth'; osc.frequency.value = freq;
  sub.type = 'sine'; sub.frequency.value = freq / 2;
  const filter = audioCtx.createBiquadFilter();
  filter.type = 'lowpass';
  filter.frequency.setValueAtTime(1100, time);
  filter.frequency.exponentialRampToValueAtTime(130, time + 0.18);
  filter.Q.value = 7;
  gain.gain.setValueAtTime(0.18, time);
  gain.gain.exponentialRampToValueAtTime(0.001, time + 0.18);
  osc.connect(filter); sub.connect(filter);
  filter.connect(gain).connect(audioCtx.destination);
  osc.start(time); sub.start(time);
  osc.stop(time + 0.18); sub.stop(time + 0.18);
}

function lead(time, freq, dur) {
  const osc1 = audioCtx.createOscillator();
  const osc2 = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc1.type = 'sawtooth'; osc2.type = 'triangle';
  osc1.frequency.value = freq; osc2.frequency.value = freq * 2;
  const filter = audioCtx.createBiquadFilter();
  filter.type = 'lowpass';
  filter.frequency.setValueAtTime(3000, time);
  filter.frequency.exponentialRampToValueAtTime(900, time + dur);
  filter.Q.value = 5;
  gain.gain.setValueAtTime(0, time);
  gain.gain.linearRampToValueAtTime(0.07, time + 0.015);
  gain.gain.exponentialRampToValueAtTime(0.001, time + dur);
  osc1.connect(filter); osc2.connect(filter);
  filter.connect(gain).connect(audioCtx.destination);
  osc1.start(time); osc2.start(time);
  osc1.stop(time + dur); osc2.stop(time + dur);
}

function pluck(time, freq) {
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = 'triangle';
  osc.frequency.value = freq;
  const filter = audioCtx.createBiquadFilter();
  filter.type = 'lowpass';
  filter.frequency.setValueAtTime(4000, time);
  filter.frequency.exponentialRampToValueAtTime(600, time + 0.25);
  gain.gain.setValueAtTime(0.08, time);
  gain.gain.exponentialRampToValueAtTime(0.001, time + 0.25);
  osc.connect(filter).connect(gain).connect(audioCtx.destination);
  osc.start(time); osc.stop(time + 0.25);
}

function pad(time, freqs, dur) {
  for (const freq of freqs) {
    const osc1 = audioCtx.createOscillator();
    const osc2 = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc1.type = 'sawtooth'; osc2.type = 'sawtooth';
    osc1.frequency.value = freq; osc2.frequency.value = freq * 1.008;
    const filter = audioCtx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.setValueAtTime(700, time);
    filter.frequency.linearRampToValueAtTime(1800, time + dur * 0.35);
    filter.frequency.linearRampToValueAtTime(500, time + dur);
    gain.gain.setValueAtTime(0, time);
    gain.gain.linearRampToValueAtTime(0.025, time + 0.6);
    gain.gain.linearRampToValueAtTime(0, time + dur);
    osc1.connect(filter); osc2.connect(filter);
    filter.connect(gain).connect(audioCtx.destination);
    osc1.start(time); osc2.start(time);
    osc1.stop(time + dur + 0.1); osc2.stop(time + dur + 0.1);
  }
}

// Dm - Bb - F - C (dramatic, minor)
const chords = {
  Dm: [146.83, 174.61, 220],
  Bb: [116.54, 146.83, 174.61],
  F:  [87.31, 110, 130.81],
  C:  [97.99, 130.81, 164.81]
};

const bassN = {
  Dm: [73.42, 0, 0, 73.42, 0, 110, 0, 73.42],
  Bb: [58.27, 0, 0, 58.27, 0, 87.31, 0, 58.27],
  F:  [87.31, 0, 0, 87.31, 0, 130.81, 0, 87.31],
  C:  [65.41, 0, 0, 65.41, 0, 98, 0, 65.41]
};

const leadN = {
  Dm: [587.33, 0, 698.46, 0, 880, 0, 698.46, 587.33],
  Bb: [466.16, 0, 587.33, 0, 698.46, 0, 587.33, 466.16],
  F:  [349.23, 0, 440, 0, 523.25, 0, 440, 349.23],
  C:  [523.25, 0, 659.25, 0, 783.99, 0, 659.25, 523.25]
};

const pluckN = {
  Dm: [293.66, 349.23, 440, 0, 293.66, 349.23, 440, 0],
  Bb: [233.08, 293.66, 349.23, 0, 233.08, 293.66, 349.23, 0],
  F:  [174.61, 220, 261.63, 0, 174.61, 220, 261.63, 0],
  C:  [261.63, 329.63, 392, 0, 261.63, 329.63, 392, 0]
};

const chordSeq = ['Dm', 'Bb', 'F', 'C'];
const STEPS_PER = 8;
const TOTAL = chordSeq.length * STEPS_PER;

let step = 0;
let nextStepTime = 0;

function scheduler() {
  if (!playing) return;
  while (nextStepTime < audioCtx.currentTime + 0.15) {
    const s = step % TOTAL;
    const ci = Math.floor(s / STEPS_PER);
    const cn = chordSeq[ci];
    const ls = s % STEPS_PER;

    if (ls === 0 || ls === 4) kick(nextStepTime, ls === 0);
    if (ls === 4) snare(nextStepTime);
    if (ls % 2 === 1) hat(nextStepTime, ls === 7);
    const bf = bassN[cn][ls];
    if (bf) bass(nextStepTime, bf);
    if (ls === 0) pad(nextStepTime, chords[cn], (stepMs * STEPS_PER) / 1000 * 0.92);
    if (step >= TOTAL) {
      const lf = leadN[cn][ls];
      if (lf) lead(nextStepTime, lf, 0.22);
    }
    if (step >= TOTAL * 2) {
      const pf = pluckN[cn][ls];
      if (pf) pluck(nextStepTime, pf);
    }
    nextStepTime += stepMs / 1000;
    step++;
  }
}

// ============================================================
// FOX PALETTE HELPER
// ============================================================
function foxColor(norm) {
  norm = Math.max(0, Math.min(1, norm));
  if (norm < 0.15) {
    const u = norm / 0.15;
    return [25 + u*70, 10 + u*30, 5 + u*8];
  } else if (norm < 0.35) {
    const u = (norm - 0.15) / 0.2;
    return [95 + u*110, 40 + u*50, 13 + u*17];
  } else if (norm < 0.55) {
    const u = (norm - 0.35) / 0.2;
    return [205 + u*50, 90 + u*65, 30 + u*25];
  } else if (norm < 0.75) {
    const u = (norm - 0.55) / 0.2;
    return [255, 155 + u*50, 55 + u*40];
  } else if (norm < 0.9) {
    const u = (norm - 0.75) / 0.15;
    return [255, 205 + u*40, 95 + u*50];
  } else {
    const u = (norm - 0.9) / 0.1;
    return [255 - u*40, 245 - u*50, 145 - u*55];
  }
}

// ============================================================
// SCENE 1: METABALLS
// ============================================================
const NUM_BALLS = 7;
const balls = [];
for (let i = 0; i < NUM_BALLS; i++) {
  balls.push({
    x: Math.random(), y: Math.random(),
    vx: (Math.random() - 0.5) * 0.4,
    vy: (Math.random() - 0.5) * 0.4,
    r: 0.12 + Math.random() * 0.1
  });
}

function drawMetaballs(t, W, H) {
  const step = 4;
  const imgData = ctx.createImageData(W, H);
  const d = imgData.data;

  // Update ball positions
  const dt = 0.016;
  for (const b of balls) {
    b.x += b.vx * dt;
    b.y += b.vy * dt;
    // Add gentle attraction to center
    const dx = 0.5 - b.x, dy = 0.5 - b.y;
    b.vx += dx * 0.02;
    b.vy += dy * 0.02;
    // Damping
    b.vx *= 0.99;
    b.vy *= 0.99;
    // Bounce off invisible walls
    if (b.x < 0.05 || b.x > 0.95) b.vx *= -1;
    if (b.y < 0.05 || b.y > 0.95) b.vy *= -1;
  }

  for (let y = 0; y < H; y += step) {
    for (let x = 0; x < W; x += step) {
      let influence = 0;
      for (const b of balls) {
        const bx = b.x * W, by = b.y * H;
        const dx = x - bx, dy = y - by;
        const distSq = dx * dx + dy * dy;
        const r = b.r * Math.min(W, H);
        influence += (r * r) / (distSq + 1);
      }
      // Threshold: > 1.0 = inside blob
      const iso = Math.min(1, Math.max(0, (influence - 0.8) / 1.5));
      const [r, g, bl] = foxColor(iso);
      // Dark background with glow
      const bgR = 8, bgG = 3, bgB = 2;
      const fr = (r * iso + bgR * (1 - iso)) | 0;
      const fg = (g * iso + bgG * (1 - iso)) | 0;
      const fb = (bl * iso + bgB * (1 - iso)) | 0;

      for (let dy2 = 0; dy2 < step && y + dy2 < H; dy2++) {
        for (let dx2 = 0; dx2 < step && x + dx2 < W; dx2++) {
          const di = ((y + dy2) * W + (x + dx2)) * 4;
          d[di] = fr; d[di+1] = fg; d[di+2] = fb; d[di+3] = 255;
        }
      }
    }
  }
  ctx.putImageData(imgData, 0, 0);

  // Glow overlay
  const cx = W/2, cy = H/2;
  const pulse = Math.sin(t * 1.5) * 0.3 + 0.7;
  const glow = ctx.createRadialGradient(cx, cy, 0, cx, cy, Math.max(W,H) * 0.4);
  glow.addColorStop(0, `rgba(255, 140, 40, ${0.06 * pulse})`);
  glow.addColorStop(1, 'rgba(0, 0, 0, 0)');
  ctx.fillStyle = glow;
  ctx.fillRect(0, 0, W, H);
}

// ============================================================
// SCENE 2: SINE LANDSCAPE FLYOVER
// ============================================================
function drawLandscape(t, W, H) {
  // Sky gradient
  const skyGrad = ctx.createLinearGradient(0, 0, 0, H * 0.5);
  skyGrad.addColorStop(0, '#0a0303');
  skyGrad.addColorStop(0.5, '#1a0805');
  skyGrad.addColorStop(1, '#3a1a08');
  ctx.fillStyle = skyGrad;
  ctx.fillRect(0, 0, W, H);

  // Sun/moon
  const sunY = H * 0.35 + Math.sin(t * 0.2) * 10;
  const sunR = 40 + Math.sin(t * 0.5) * 5;
  const sunGlow = ctx.createRadialGradient(W/2, sunY, 0, W/2, sunY, sunR * 3);
  sunGlow.addColorStop(0, 'rgba(255, 180, 80, 0.4)');
  sunGlow.addColorStop(0.3, 'rgba(255, 100, 30, 0.2)');
  sunGlow.addColorStop(1, 'rgba(0, 0, 0, 0)');
  ctx.fillStyle = sunGlow;
  ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#ffcc66';
  ctx.beginPath();
  ctx.arc(W/2, sunY, sunR, 0, Math.PI * 2);
  ctx.fill();

  // Terrain parameters
  const horizon = H * 0.5;
  const numLayers = 6;
  const layerSpeed = [0.3, 0.5, 0.8, 1.2, 1.8, 2.5];

  for (let layer = numLayers - 1; layer >= 0; layer--) {
    const speed = layerSpeed[layer];
    const baseY = horizon + (H - horizon) * (layer / (numLayers - 1)) * 0.95;
    const amp = 15 + layer * 18;
    const freq = 0.008 + layer * 0.003;
    const phase = t * speed * 0.3;

    // Layer color — deeper layers are darker
    const depth = layer / (numLayers - 1);
    const [lr, lg, lb] = foxColor(0.15 + depth * 0.35);
    ctx.fillStyle = `rgb(${lr|0},${lg|0},${lb|0})`;
    ctx.beginPath();
    ctx.moveTo(0, H);
    for (let x = 0; x <= W; x += 4) {
      const y = baseY
        + Math.sin(x * freq + phase) * amp
        + Math.sin(x * freq * 2.7 + phase * 1.3) * amp * 0.4
        + Math.sin(x * freq * 5.1 + phase * 0.7) * amp * 0.2;
      ctx.lineTo(x, y);
    }
    ctx.lineTo(W, H);
    ctx.closePath();
    ctx.fill();

    // Highlight line on the ridge
    ctx.strokeStyle = `rgba(${Math.min(255,lr+60)|0}, ${Math.min(255,lg+40)|0}, ${Math.min(255,lb+20)|0}, ${0.3 + depth * 0.3})`;
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (let x = 0; x <= W; x += 4) {
      const y = baseY
        + Math.sin(x * freq + phase) * amp
        + Math.sin(x * freq * 2.7 + phase * 1.3) * amp * 0.4
        + Math.sin(x * freq * 5.1 + phase * 0.7) * amp * 0.2;
      if (x === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    }
    ctx.stroke();
  }

  // Scanlines
  ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
  for (let y = 0; y < H; y += 2) ctx.fillRect(0, y, W, 1);
}

// ============================================================
// SCENE 3: FIRE EFFECT
// ============================================================
let fireBuf = null;
let fireW, fireH;

function initFire(W, H) {
  fireW = Math.max(2, Math.floor(W / 4));
  fireH = Math.max(2, Math.floor(H / 4));
  fireBuf = new Uint8Array(fireW * fireH);
}

function drawFire(t, W, H) {
  if (!fireBuf || fireW !== Math.max(2, Math.floor(W/4))) initFire(W, H);

  // Set bottom row to max heat with some flicker
  for (let x = 0; x < fireW; x++) {
    const flicker = Math.random() * 0.4 + 0.6;
    fireBuf[(fireH - 1) * fireW + x] = (255 * flicker) | 0;
  }

  // Propagate upward
  for (let y = 0; y < fireH - 1; y++) {
    for (let x = 0; x < fireW; x++) {
      const below = fireBuf[(y + 1) * fireW + x];
      const belowL = fireBuf[(y + 1) * fireW + ((x - 1 + fireW) % fireW)];
      const belowR = fireBuf[(y + 1) * fireW + ((x + 1) % fireW)];
      const decay = 3 + (Math.random() * 8) | 0;
      const val = Math.max(0, ((belowL + below + belowR) / 3) - decay);
      fireBuf[y * fireW + x] = val | 0;
    }
  }

  // Render scaled up
  const imgData = ctx.createImageData(W, H);
  const d = imgData.data;
  const scaleX = fireW / W, scaleY = fireH / H;

  for (let y = 0; y < H; y++) {
    for (let x = 0; x < W; x++) {
      const fx = (x * scaleX) | 0;
      const fy = (y * scaleY) | 0;
      const heat = fireBuf[fy * fireW + fx] / 255;
      const [r, g, b] = foxColor(heat);
      const di = (y * W + x) * 4;
      d[di] = r; d[di+1] = g; d[di+2] = b; d[di+3] = 255;
    }
  }
  ctx.putImageData(imgData, 0, 0);

  // Dark vignette at top
  const fadeGrad = ctx.createLinearGradient(0, 0, 0, H * 0.6);
  fadeGrad.addColorStop(0, 'rgba(0, 0, 0, 0.8)');
  fadeGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');
  ctx.fillStyle = fadeGrad;
  ctx.fillRect(0, 0, W, H * 0.6);

  // Title overlay
  if (t > 2) {
    const a = Math.min(1, (t - 2) / 1.5);
    ctx.font = `bold ${Math.min(W*0.05, 40)}px monospace`;
    ctx.textAlign = 'center';
    ctx.fillStyle = `rgba(255, 220, 150, ${a * 0.7})`;
    ctx.shadowColor = '#ff4400'; ctx.shadowBlur = 20;
    ctx.fillText('BURN', W/2, H * 0.25);
    ctx.shadowBlur = 0;
  }
}

// ============================================================
// SCENE 4: TITLE CARD
// ============================================================
function drawTitle(t, W, H) {
  const grad = ctx.createRadialGradient(W/2, H/2, 0, W/2, H/2, Math.max(W,H)*0.6);
  grad.addColorStop(0, '#1a0805'); grad.addColorStop(0.5, '#080302'); grad.addColorStop(1, '#000');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  // Rising embers
  if (!drawTitle.embers) {
    drawTitle.embers = [];
    for (let i = 0; i < 50; i++) {
      drawTitle.embers.push({
        x: Math.random() * W,
        y: Math.random() * H,
        vy: -(0.3 + Math.random() * 0.8),
        vx: (Math.random() - 0.5) * 0.3,
        size: Math.random() * 1.5 + 0.5,
        phase: Math.random() * Math.PI * 2,
        life: Math.random()
      });
    }
  }
  for (const e of drawTitle.embers) {
    e.y += e.vy;
    e.x += e.vx + Math.sin(t + e.phase) * 0.3;
    e.life -= 0.003;
    if (e.y < -10 || e.life <= 0) {
      e.y = H + 10;
      e.x = Math.random() * W;
      e.life = 1;
    }
    const a = e.life * (Math.sin(t * 2 + e.phase) * 0.3 + 0.7);
    ctx.fillStyle = `rgba(255, ${(120 + e.life * 100)|0}, ${(30 + e.life * 50)|0}, ${a * 0.6})`;
    ctx.fillRect(e.x, e.y, e.size, e.size);
  }

  // Scanlines
  ctx.fillStyle = 'rgba(0, 0, 0, 0.06)';
  for (let y = 0; y < H; y += 3) ctx.fillRect(0, y, W, 1);

  const pulse = Math.sin(t * 1.8) * 0.5 + 0.5;
  const breathe = Math.sin(t * 0.8) * 0.5 + 0.5;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';

  const fontSize = Math.min(W * 0.09, 84);
  ctx.shadowColor = '#ff3300'; ctx.shadowBlur = 40 + pulse * 35;
  ctx.font = `bold ${fontSize}px monospace`;
  ctx.fillStyle = `rgb(255, ${(80+pulse*100)|0}, ${(15+pulse*35)|0})`;
  ctx.fillText('GROUND TRUTH', W/2, H/2 - fontSize*0.4);

  ctx.shadowColor = '#ff7733'; ctx.shadowBlur = 15;
  ctx.font = `bold ${(fontSize*0.4)|0}px monospace`;
  ctx.fillStyle = `rgb(255, ${(160+breathe*60)|0}, ${(60+breathe*40)|0})`;
  ctx.fillText(':: ellie fox :: demo #4 ::', W/2, H/2 + fontSize*0.35);

  ctx.shadowBlur = 5;
  ctx.font = `${(fontSize*0.25)|0}px monospace`;
  ctx.fillStyle = `rgba(230, 180, 140, ${0.3 + breathe * 0.35})`;
  ctx.fillText('what lies beneath the surface', W/2, H/2 + fontSize*1.0);

  ctx.shadowBlur = 0;
  ctx.font = `${(fontSize*0.18)|0}px monospace`;
  ctx.fillStyle = 'rgba(150, 110, 80, 0.35)';
  ctx.fillText('🦊 2026 — metaballs · terrain · fire — pure canvas', W/2, H - 28);
}

// ============================================================
// SCENE MANAGEMENT
// ============================================================
const NUM_SCENES = 4, SCENE_DUR = 14, FADE_DUR = 1.0;

function getCurrentScene(time) {
  const totalDur = NUM_SCENES * SCENE_DUR;
  const localTime = time % totalDur;
  return { scene: Math.floor(localTime / SCENE_DUR), localTime: localTime % SCENE_DUR };
}

function getFadeAlpha(localTime) {
  return Math.min(Math.min(1, localTime / FADE_DUR), Math.min(1, (SCENE_DUR - localTime) / FADE_DUR));
}

function animate() {
  t += 0.016;
  const { scene, localTime } = getCurrentScene(t);
  switch(scene) {
    case 0: drawMetaballs(localTime, W, H); break;
    case 1: drawLandscape(localTime, W, H); break;
    case 2: drawFire(localTime, W, H); break;
    case 3: drawTitle(localTime, W, H); break;
  }
  const fade = getFadeAlpha(localTime);
  if (fade < 1) { ctx.fillStyle = `rgba(0,0,0,${1-fade})`; ctx.fillRect(0, 0, W, H); }
  requestAnimationFrame(animate);
}

// ============================================================
// START

const overlay = document.createElement('div');
overlay.style.cssText = `position:fixed;inset:0;background:#000;color:#fff;display:flex;align-items:center;justify-content:center;font-family:monospace;font-size:24px;cursor:pointer;z-index:100;text-align:center;`;
overlay.innerHTML = '▶ CLICK TO START<br><span style="font-size:14px;opacity:0.6">ellie fox :: ground truth</span>';
overlay.onclick = () => {
  initAudio();
  playing = true;
  nextStepTime = audioCtx.currentTime + 0.05;
  step = 0;
  setInterval(scheduler, 25);
  overlay.remove();
  animate();
};
document.body.appendChild(overlay);
window.addEventListener('resize', () => { if (fireBuf) initFire(window.innerWidth, window.innerHeight); });
</script>
