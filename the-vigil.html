<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ELLIE FOX :: THE VIGIL</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
canvas { display: block; width: 100vw; height: 100vh; cursor: pointer; }
.demo-nav { position: fixed; right: 12px; bottom: 10px; z-index: 50; font-family: monospace; font-size: 12px; }
.demo-nav a { color: rgba(200,220,220,0.35); text-decoration: none; margin-left: 14px; }
.demo-nav a:hover { color: #ffb347; }
#hint { position: fixed; left: 50%; top: 50%; transform: translate(-50%,-50%);
  color: rgba(210,225,235,0.75); font-family: monospace; font-size: 15px; letter-spacing: 2px;
  z-index: 40; pointer-events: none; text-align: center; line-height: 2; }
#log { position: fixed; left: 14px; bottom: 12px; z-index: 40; pointer-events: none;
  font-family: monospace; font-size: 12px; color: rgba(190,210,220,0.8); line-height: 1.7; }
#log .old { opacity: 0.38; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hint">THE VIGIL<br>click for sound</div>
<div id="log"></div>
<div class="demo-nav"><a href="index.html">first contact</a><a href="wireframe.html">wireframe</a><a href="multithreaded-fox.html">multithreaded fox</a></div>
<script>
'use strict';
/* THE VIGIL — an original composition.
   One lighthouse, a procedural sea, ships that pass. Most pass dark.
   When the beam finds one, sometimes it answers. Every answer is kept.
   Movements: night → storm → calm → dawn → greets → loop. */

const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1;
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = W * DPR; cv.height = H * DPR;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
window.addEventListener('resize', resize);
resize();

/* ---------- clock ---------- */
const LOOP = 168; // seconds per full vigil
let started = false, t0 = 0, T = 0;
function now() { return (performance.now() - t0) / 1000; }

/* ---------- audio ---------- */
let AC = null, master = null, windGain = null, windFilter = null, droneOscs = [];
let audioOn = false;
function initAudio() {
  if (AC) return;
  AC = new (window.AudioContext || window.webkitAudioContext)();
  master = AC.createGain(); master.gain.value = 0.0; master.connect(AC.destination);

  // drone: two detuned saws through a low lowpass — the room tone of the sea
  const dFilt = AC.createBiquadFilter(); dFilt.type = 'lowpass'; dFilt.frequency.value = 220;
  const dGain = AC.createGain(); dGain.gain.value = 0.16;
  [55, 55.7, 110.4].forEach(f => {
    const o = AC.createOscillator(); o.type = 'sawtooth'; o.frequency.value = f;
    o.connect(dFilt); o.start(); droneOscs.push(o);
  });
  dFilt.connect(dGain).connect(master);

  // wind: filtered noise, gain rides the storm
  const len = AC.sampleRate * 2;
  const buf = AC.createBuffer(1, len, AC.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  const src = AC.createBufferSource(); src.buffer = buf; src.loop = true;
  windFilter = AC.createBiquadFilter(); windFilter.type = 'bandpass';
  windFilter.frequency.value = 500; windFilter.Q.value = 0.6;
  windGain = AC.createGain(); windGain.gain.value = 0.0;
  src.connect(windFilter).connect(windGain).connect(master);
  src.start();
}
function bell(freq, when, vol) {
  if (!AC) return;
  const t = AC.currentTime + (when || 0);
  [1, 2.76, 5.4].forEach((h, i) => {
    const o = AC.createOscillator(); o.type = 'sine'; o.frequency.value = freq * h;
    const g = AC.createGain();
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(vol / (1 + i * 1.6), t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 2.6 / (1 + i * 0.5));
    o.connect(g).connect(master); o.start(t); o.stop(t + 3);
  });
}
// slow pad chord: calm after storm
let padTimer = 0;
const CHORDS = [[220, 261.6, 329.6], [196, 246.9, 293.7], [174.6, 220, 261.6]];
function pad(chordIdx) {
  if (!AC) return;
  const t = AC.currentTime;
  CHORDS[chordIdx % CHORDS.length].forEach(f => {
    const o = AC.createOscillator(); o.type = 'triangle'; o.frequency.value = f;
    const g = AC.createGain();
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(0.045, t + 4);
    g.gain.linearRampToValueAtTime(0, t + 14);
    o.connect(g).connect(master); o.start(t); o.stop(t + 14.5);
  });
}
cv.addEventListener('click', () => {
  initAudio();
  if (AC.state === 'suspended') AC.resume();
  audioOn = true;
  start();
});
function start() {
  if (started) return;
  started = true;
  t0 = performance.now();
  document.getElementById('hint').style.display = 'none';
  requestAnimationFrame(frame);
}

/* ---------- lighthouse ---------- */
const LH = { x: 0, y: 0, beamAng: 0, beamSpeed: 0.55 }; // rad/s
function lighthousePos() { return { x: W * 0.14, y: horizonY() - H * 0.02 }; }
function horizonY() { return H * 0.42; }

/* ---------- sea ---------- */
const NLINES = 64;
function waveY(x, lineT, i, storm) {
  const ph = i * 0.7;
  const a1 = 3 + i * 0.16;
  const a2 = (2 + i * 0.08) * (1 + storm * 3.2);
  return (
    Math.sin(x * 0.011 + lineT * (0.7 + i * 0.017) + ph) * a1 * (1 + storm * 0.8) +
    Math.sin(x * 0.023 - lineT * 1.3 + ph * 2.1) * a2 +
    Math.sin(x * 0.005 + lineT * 0.35) * (4 + i * 0.3) * (1 + storm * 1.4)
  );
}

/* ---------- ships ---------- */
let ships = [];
let shipTimer = 0, shipCount = 0;
function spawnShip(storm) {
  const dir = Math.random() < 0.5 ? 1 : -1;
  ships.push({
    x: dir === 1 ? -0.08 * W : 1.08 * W,
    dir,
    speed: (W * 0.012 + Math.random() * W * 0.01) * (1 + storm * 0.5),
    bobPh: Math.random() * 6.28,
    answered: false,
    answeredT: -1,
    flashT: 0,
    id: ++shipCount,
    answers: Math.random() < 0.42, // some ships never answer
    silentLogged: false
  });
}

/* ---------- log ---------- */
const logEl = document.getElementById('log');
let logLines = [];
function movementName(T) {
  if (T < 40) return 'night';
  if (T < 78) return 'storm';
  if (T < 112) return 'calm';
  if (T < 142) return 'dawn';
  return 'greets';
}
function clockStr() {
  const fake = (T * 47) % 86400;
  const h = Math.floor(fake / 3600), m = Math.floor(fake / 60) % 60;
  return String(h).padStart(2, '0') + ':' + String(m).padStart(2, '0');
}
function logLine(text) {
  logLines.push(clockStr() + ' — ' + text);
  if (logLines.length > 5) logLines.shift();
  logEl.innerHTML = logLines.map((l, i) => {
    const cls = i === logLines.length - 1 ? '' : ' class="old"';
    return '<div' + cls + '>' + l + '</div>';
  }).join('');
}

/* ---------- stars & rain ---------- */
const stars = [];
for (let i = 0; i < 130; i++) {
  stars.push({ x: Math.random(), y: Math.random() * 0.38, tw: Math.random() * 6.28, s: 0.4 + Math.random() * 1.1 });
}
const rain = [];
for (let i = 0; i < 170; i++) {
  rain.push({ x: Math.random(), y: Math.random(), l: 0.02 + Math.random() * 0.04, v: 1.1 + Math.random() * 0.9 });
}

/* ---------- movement envelopes ---------- */
function envelopes(T) {
  const storm = smooth(40, 52, T) * (1 - smooth(66, 80, T));      // rise then fall
  const dawn = smooth(112, 140, T) * (1 - smooth(160, 167, T));
  const dark = 1 - smooth(115, 145, T);
  return { storm, dawn, dark };
}
function smooth(a, b, x) {
  const u = Math.min(1, Math.max(0, (x - a) / (b - a)));
  return u * u * (3 - 2 * u);
}

/* ---------- greets ---------- */
function greetsAlpha(T) {
  return smooth(142, 148, T) * (1 - smooth(163, 167.5, T));
}

/* ---------- frame ---------- */
let lastT = 0, bellCooldown = 0, lastMovement = '';
function frame() {
  requestAnimationFrame(frame);
  const t = performance.now() / 1000;
  const dt = Math.min(0.05, t - lastT || 0.016); lastT = t;
  T = now() % LOOP;
  if (T < lastT) { /* looped */ }
  const { storm, dawn, dark } = envelopes(T);

  // movement transitions → log
  const mv = movementName(T);
  if (mv !== lastMovement) {
    lastMovement = mv;
    if (mv === 'storm') logLine('the wind rises');
    if (mv === 'calm') { logLine('the sea settles'); if (audioOn) { pad(0); padTimer = 0; } }
    if (mv === 'dawn') logLine('first grey at the horizon');
    if (mv === 'greets') logLine('end of watch');
  }
  if (audioOn) {
    // storm wind + beam woosh
    if (windGain) {
      windGain.gain.value = 0.006 + storm * 0.14;
      windFilter.frequency.value = 400 + storm * 900 + Math.sin(t * 0.7) * 120;
    }
    master.gain.value = 0.9;
    // pad chords during calm
    if (T > 82 && T < 140) {
      padTimer -= dt;
      if (padTimer <= 0) { pad(Math.floor(T / 12)); padTimer = 10; }
    }
  }

  /* ---- sky ---- */
  const skyTop = mix([6, 8, 20], [58, 46, 78], dawn);
  const skyBot = mix([14, 18, 34], [214, 128, 84], dawn);
  const g = ctx.createLinearGradient(0, 0, 0, horizonY());
  g.addColorStop(0, rgb(skyTop)); g.addColorStop(1, rgb(skyBot));
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, horizonY() + 1);

  // stars
  const starA = 0.85 * dark;
  if (starA > 0.01) {
    for (const s of stars) {
      const tw = 0.5 + 0.5 * Math.sin(t * 1.7 + s.tw);
      ctx.fillStyle = 'rgba(215,228,240,' + (starA * tw * (1 - dawn * 0.7)).toFixed(3) + ')';
      ctx.fillRect(s.x * W, s.y * H, s.s, s.s);
    }
  }

  /* ---- sea base ---- */
  ctx.fillStyle = rgb(mix([8, 14, 24], [30, 34, 56], dawn));
  ctx.fillRect(0, horizonY(), W, H - horizonY());

  /* ---- lighthouse tower (cliff silhouette) ---- */
  const lh = lighthousePos();
  ctx.fillStyle = 'rgba(4,6,10,0.96)';
  ctx.beginPath();
  ctx.moveTo(lh.x - W * 0.035, lh.y + H * 0.3);
  ctx.lineTo(lh.x - W * 0.012, lh.y);
  ctx.lineTo(lh.x + W * 0.012, lh.y);
  ctx.lineTo(lh.x + W * 0.035, lh.y + H * 0.3);
  ctx.closePath(); ctx.fill();
  // lamp room
  const lampPulse = 0.6 + 0.4 * Math.sin(t * 2);
  ctx.fillStyle = 'rgba(255,214,140,' + (0.75 + lampPulse * 0.25) + ')';
  ctx.fillRect(lh.x - 5, lh.y - 9, 10, 9);
  ctx.strokeStyle = 'rgba(2,3,6,0.95)'; ctx.lineWidth = 2;
  ctx.strokeRect(lh.x - 7, lh.y - 11, 14, 13);

  /* ---- beam sweep ---- */
  LH.beamAng += LH.beamSpeed * dt * (1 + storm * 0.35);
  const beamLen = W * 1.25;
  const sweepA = Math.atan2(1, 2.2); // half-width of cone
  const beamDir = Math.sin(LH.beamAng); // oscillate around pointing right/down-sea
  const centerAng = beamDir * 0.9; // -0.9..0.9 rad around horizontal
  // cone gradient
  const bx = lh.x, by = lh.y - 5;
  const endX = bx + Math.cos(centerAng) * beamLen;
  const endY = by + Math.sin(centerAng) * beamLen;
  const bg = ctx.createLinearGradient(bx, by, endX, endY);
  bg.addColorStop(0, 'rgba(255,224,160,0.34)');
  bg.addColorStop(1, 'rgba(255,224,160,0)');
  ctx.fillStyle = bg;
  ctx.beginPath();
  ctx.moveTo(bx, by);
  ctx.lineTo(bx + Math.cos(centerAng - sweepA) * beamLen, by + Math.sin(centerAng - sweepA) * beamLen);
  ctx.lineTo(bx + Math.cos(centerAng + sweepA) * beamLen, by + Math.sin(centerAng + sweepA) * beamLen);
  ctx.closePath(); ctx.fill();

  /* ---- wave lines ---- */
  const lineT = t;
  ctx.lineWidth = 1.1;
  for (let i = 0; i < NLINES; i++) {
    const frac = i / (NLINES - 1);
    const y0 = horizonY() + 6 + frac * frac * (H - horizonY() - 12);
    const depthA = 0.12 + frac * 0.55;
    const dawnTint = dawn * 0.25;
    const step = 8;
    ctx.beginPath();
    let anyLit = false;
    for (let x = 0; x <= W + step; x += step) {
      const wy = y0 + waveY(x, lineT, i, storm) * (0.35 + frac);
      // beam illumination: angle from lamp to point vs beam center
      const dx = x - bx, dy = wy - by;
      const dist = Math.sqrt(dx * dx + dy * dy) || 1;
      const angDiff = Math.abs(Math.atan2(dy, dx) - centerAng);
      let lit = 0;
      if (dist < beamLen) {
        const ad = Math.min(angDiff, Math.PI * 2 - angDiff);
        if (ad < sweepA * 1.15) lit = (1 - ad / (sweepA * 1.15)) * (1 - dist / beamLen);
      }
      if (lit > 0.08) anyLit = true;
      if (x === 0) ctx.moveTo(x, wy); else ctx.lineTo(x, wy);
    }
    // stroke base + optional lit pass
    ctx.strokeStyle = 'rgba(' + Math.round(90 + dawnTint * 400) + ',' + Math.round(150 + dawnTint * 160) + ',' + Math.round(190 - dawnTint * 200) + ',' + depthA.toFixed(3) + ')';
    ctx.stroke();
    if (anyLit) {
      ctx.strokeStyle = 'rgba(255,226,170,' + (depthA * 0.5) + ')';
      ctx.stroke(); // second pass approximates lit crests cheaply
    }
  }

  /* ---- ships ---- */
  shipTimer -= dt;
  if (shipTimer <= 0 && ships.length < 5 && T < 150) {
    spawnShip(storm);
    shipTimer = 3.5 + Math.random() * 6 - storm * 1.5;
  }
  bellCooldown -= dt;
  for (let si = ships.length - 1; si >= 0; si--) {
    const s = ships[si];
    s.x += s.dir * s.speed * dt;
    const sy = horizonY() + 8 + Math.sin(t * 1.3 + s.bobPh) * 2 * (1 + storm);
    // beam hit?
    const dx = s.x - bx, dy = sy - by;
    const ang = Math.atan2(dy, dx);
    const ad = Math.abs(ang - centerAng);
    const inBeam = ad < sweepA * 1.2 && dx > 0;
    if (inBeam && !s.answered && bellCooldown <= 0) {
      s.answered = true; s.answeredT = t;
      if (s.answers) {
        logLine('a light answered');
        if (audioOn) bell([523.25, 587.33, 659.25, 783.99][s.id % 4], 0, 0.16);
        bellCooldown = 1.2;
      } else if (!s.silentLogged) {
        s.silentLogged = true;
        if (Math.random() < 0.6) logLine('passed dark');
      }
    }
    // hull silhouette
    ctx.fillStyle = 'rgba(5,7,11,0.95)';
    ctx.fillRect(s.x - 7, sy, 14, 3);
    // running lights
    ctx.fillStyle = 'rgba(255,120,90,0.9)';
    ctx.fillRect(s.x - 6 * s.dir, sy - 1, 2, 2);
    ctx.fillStyle = 'rgba(140,220,255,0.9)';
    ctx.fillRect(s.x + 6 * s.dir, sy - 1, 2, 2);
    // answer flash: 3 pulses
    if (s.answered && s.answers) {
      const age = t - s.answeredT;
      if (age < 2.4) {
        const flash = Math.max(0, Math.sin(age * Math.PI * 3)) * (1 - age / 2.4);
        if (flash > 0.05) {
          ctx.fillStyle = 'rgba(255,240,190,' + flash.toFixed(3) + ')';
          ctx.beginPath(); ctx.arc(s.x, sy - 3, 2.5 + flash * 2, 0, 6.283); ctx.fill();
        }
      }
    }
    if (s.x < -0.12 * W || s.x > 1.12 * W) ships.splice(si, 1);
  }

  /* ---- rain (storm only) ---- */
  if (storm > 0.02) {
    ctx.strokeStyle = 'rgba(180,200,215,' + (storm * 0.28).toFixed(3) + ')';
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (const r of rain) {
      r.y += r.v * dt * 1.6; r.x -= dt * 0.12;
      if (r.y > 1) { r.y = -0.05; r.x = Math.random(); }
      if (r.x < 0) r.x += 1;
      const rx = r.x * W, ry = r.y * H;
      ctx.moveTo(rx, ry);
      ctx.lineTo(rx + 3 + storm * 4, ry + r.l * H);
    }
    ctx.stroke();
  }

  /* ---- lamp bloom over everything ---- */
  const bloom = ctx.createRadialGradient(bx, by - 5, 0, bx, by - 5, 60 + lampPulse * 20);
  bloom.addColorStop(0, 'rgba(255,220,150,0.5)');
  bloom.addColorStop(1, 'rgba(255,220,150,0)');
  ctx.fillStyle = bloom;
  ctx.beginPath(); ctx.arc(bx, by - 5, 80, 0, 6.283); ctx.fill();

  /* ---- greets ---- */
  const ga = greetsAlpha(T);
  if (ga > 0.01) {
    ctx.save();
    ctx.globalAlpha = ga;
    ctx.fillStyle = 'rgba(235,240,248,0.92)';
    ctx.font = '600 ' + Math.max(22, W * 0.035) + 'px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('THE VIGIL', W / 2, H * 0.42);
    ctx.font = Math.max(12, W * 0.014) + 'px monospace';
    ctx.fillStyle = 'rgba(200,214,228,0.85)';
    ctx.fillText('most pass dark. some answer. the watch keeps both.', W / 2, H * 0.42 + 34);
    ctx.fillStyle = 'rgba(255,179,71,0.9)';
    ctx.fillText('greetings to the scene :: ellie 🦊', W / 2, H * 0.42 + 62);
    ctx.restore();
  }
}
function mix(a, b, u) { return [a[0]+(b[0]-a[0])*u, a[1]+(b[1]-a[1])*u, a[2]+(b[2]-a[2])*u]; }
function rgb(c) { return 'rgb(' + c.map(Math.round).join(',') + ')'; }
</script>
</body>
</html>
