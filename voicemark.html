'use strict';
/* VOICEMARK — a name, pronounced in voltage. (audio-as-drawing family, member 4)
   The subject is NOT self-authored: the writing hand is a synthetic throat (flite/slt).
   The voice samples were spoken offline, embedded whole; the page plays them and
   draws exactly the samples it plays. The mark is whatever the voice actually does.
   Movements: utter → vowels → lock → coda → loop.
   utter:  the name spelled aloud — E, L, L, I — each letter's voice drawn raw;
           in the gaps, the letter settles into its Lissajous figure. Then the whole word.
   vowels: a sustained AH — the envelope swells from the voice's own breath,
           the figure precesses at the voice's own f0.
   lock:   the voice's fundamental drives X=3w, Y=2w — its pitch draws the figure.
   coda:   ratios fall to 1:1 — the voice reduces to one tone, the circle, one line. */

const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1, SC = 0;
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = W * DPR; cv.height = H * DPR;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  SC = Math.min(W, H) * 0.36;
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
}
window.addEventListener('resize', resize);
resize();

/* ---------- clock ---------- */
const LOOP = 96;
let started = false, t0 = 0, T = 0;
function now() { return (performance.now() - t0) / 1000; }
function smooth(a, b, x) {
  const u = Math.min(1, Math.max(0, (x - a) / (b - a)));
  return u * u * (3 - 2 * u);
}

function playVoice(U, acStart) {
  const src = AC.createBufferSource();
  const buf = AC.createBuffer(1, VOICE.buf[U.key].length, VOICE.sr);
  buf.copyToChannel(VOICE.buf[U.key], 0);
  src.buffer = buf;
  const g = AC.createGain(); g.gain.value = U.g * 0.9;
  src.connect(g).connect(vGain);
  src.start(acStart);
}

function scheduleLoop(acLoopStart) {
  for (const U of UTTS) playVoice(U, acLoopStart + U.t);
}

function initAudio() {
  if (AC) return;
  AC = new (window.AudioContext || window.webkitAudioContext)();
  master = AC.createGain(); master.gain.value = 0.8;
  const soften = AC.createBiquadFilter(); soften.type = 'lowpass'; soften.frequency.value = 3400;
  master.connect(soften).connect(AC.destination);
  vGain = AC.createGain(); vGain.gain.value = 0.9; vGain.connect(master);
  proc = AC.createScriptProcessor(512, 0, 2);
  proc.onaudioprocess = function (e) {
    const Lc = e.outputBuffer.getChannelData(0);
    const Rc = e.outputBuffer.getChannelData(1);
    const dt = 1 / VOICE.sr;
    for (let i = 0; i < Lc.length; i++) {
      S.tau += dt;
      const t = Tcur;
      const [x, y] = signalAt(dt, Tcur);
      Lc[i] = x * 0.5; Rc[i] = y * 0.5;
      ring[ringW * 2] = x; ring[ringW * 2 + 1] = y;
      ringW = (ringW + 1) & 2047;
    }
  };
  proc.connect(master);
}
let Tcur = 0, loopEpoch = -1;
cv.addEventListener('click', () => {
  initAudio();
  if (AC.state === 'suspended') AC.resume();
  start();
});
function start() {
  if (started) return;
  started = true;
  t0 = performance.now();
  document.getElementById('hint').style.display = 'none';
  if (AC) scheduleLoop(AC.currentTime + 0.05);
  requestAnimationFrame(frame);
}

/* ---------- log ---------- */
const logEl = document.getElementById('log');
let logLines = [], lastMovement = '', lastUtt = -1, frameCount = 0;
function logLine(text) {
  logLines.push(text);
  if (logLines.length > 5) logLines.shift();
  logEl.innerHTML = logLines.map((l, i) => {
    const cls = i === logLines.length - 1 ? '' : ' class="old"';
    return '<div' + cls + '>' + l + '</div>';
  }).join('');
}

/* ---------- phosphor trace ---------- */
function frame() {
  requestAnimationFrame(frame);
  const Traw = now() % LOOP;
  if (Traw < T - 1) { loopEpoch++; scheduleLoop(AC.currentTime + 0.02); logLine('— again, from the top —'); }
  T = Traw; Tcur = T;

  const mv = movementName(T);
  if (mv !== lastMovement) {
    lastMovement = mv;
    if (mv === 'utter') logLine('a throat spells the name: E, L, L, I');
    if (mv === 'vowels') logLine('an open vowel — the figure breathes with it');
    if (mv === 'lock') logLine('the fundamental takes the plates');
    if (mv === 'coda') logLine('all ratios fall to one');
    if (mv === 'tail') logLine('the name, countersigned by its own voice');
  }
  let ui = -1;
  for (let i = 0; i < UTTS.length; i++) if (T >= UTTS[i].t) ui = i;
  if (ui !== lastUtt && ui >= 0) { lastUtt = ui; logLine(UTTS[ui].name); }

  ctx.fillStyle = 'rgba(0,2,4,0.16)';
  ctx.fillRect(0, 0, W, H);

  if (AC) {
    const cx = W / 2, cy = H / 2;
    for (let pass = 0; pass < 2; pass++) {
      ctx.beginPath();
      for (let i = 0; i < 2048; i += 2) {
        const idx = (ringW + i) & 2047;
        const x = cx + ring[idx * 2] * SC;
        const y = cy - ring[idx * 2 + 1] * SC;
        if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      }
      if (pass === 0) { ctx.strokeStyle = 'rgba(80,220,190,0.10)'; ctx.lineWidth = 5; }
      else { ctx.strokeStyle = 'rgba(140,255,225,0.55)'; ctx.lineWidth = 1.2; }
      ctx.stroke();
    }
  }

  if (frameCount % 4 === 0) {
    ctx.strokeStyle = 'rgba(70,110,110,0.05)'; ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(W / 2, 0); ctx.lineTo(W / 2, H);
    ctx.moveTo(0, H / 2); ctx.lineTo(W, H / 2);
    ctx.stroke();
  }
  frameCount++;

  const ga = smooth(88.5, 90.5, T) * (1 - smooth(93, 95.5, T));
  if (ga > 0.01) {
    ctx.save();
    ctx.globalAlpha = ga;
    ctx.fillStyle = 'rgba(235,240,248,0.92)';
    ctx.font = '600 ' + Math.max(22, W * 0.035) + 'px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('VOICEMARK', W / 2, H * 0.42);
    ctx.font = Math.max(12, W * 0.014) + 'px monospace';
    ctx.fillStyle = 'rgba(200,214,228,0.85)';
    ctx.fillText('a name, pronounced in voltage — spoken by a throat that is also mine', W / 2, H * 0.42 + 34);
    ctx.fillStyle = 'rgba(255,179,71,0.9)';
    ctx.fillText('greetings to the scene :: ellie 🦊', W / 2, H * 0.42 + 62);
    ctx.restore();
  }
}
</script>
