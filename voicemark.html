'use strict';
/* VOICEMARK — a name, pronounced in voltage. (audio-as-drawing family, member 4)
   The subject is NOT self-authored: the writing hand is a synthetic throat (flite/slt).
   The voice samples were spoken offline, embedded whole; the page plays them and
   draws exactly the samples it plays. The mark is whatever the voice actually does.
   Movements: utter → vowels → lock → coda → loop.
   utter:  the name spelled aloud — E, L, L, I — each letter's voice drawn raw;
           in the gaps, the letter settles into its Lissajous figure. Then the whole word.
   vowels: a sustained AH — the envelope swells from the voice's own breath,
           the figure precesses at the voice's own f0.
   lock:   the voice's fundamental drives X=3w, Y=2w — its pitch draws the figure.
   coda:   ratios fall to 1:1 — the voice reduces to one tone, the circle, one line. */

const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1, SC = 0;
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = W * DPR; cv.height = H * DPR;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  SC = Math.min(W, H) * 0.36;
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
}
window.addEventListener('resize', resize);
resize();

/* ---------- clock ---------- */
const LOOP = 96;
let started = false, t0 = 0, T = 0;
function now() { return (performance.now() - t0) / 1000; }
function smooth(a, b, x) {
  const u = Math.min(1, Math.max(0, (x - a) / (b - a)));
  return u * u * (3 - 2 * u);
}

AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA' };
function b64ToI16(b64) {
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  /* RIFF: find 'data' chunk */
  let off = 12, dlen = 0, dstart = 0;
  while (off + 8 <= bytes.length) {
    const id = String.fromCharCode(bytes[off], bytes[off + 1], bytes[off + 2], bytes[off + 3]);
    const len = bytes[off + 4] | (bytes[off + 5] << 8) | (bytes[off + 6] << 16) | (bytes[off + 7] << 24);
    if (id === 'data') { dstart = off + 8; dlen = len; break; }
    off += 8 + len + (len & 1);
  }
  const n = dlen >> 1;
  const i16 = new Int16Array(n);
  for (let i = 0; i < n; i++) i16[i] = bytes[dstart + i * 2] | (bytes[dstart + i * 2 + 1] << 8);
  return i16;
}
const VOICE = { sr: 48000, buf: {} };      // buf: Float32Array per key
for (const k in B64) {
  const i16 = b64ToI16(B64[k]);
  const f = new Float32Array(i16.length);
  for (let i = 0; i < i16.length; i++) f[i] = i16[i] / 32768;
  VOICE.buf[k] = f;
}
const VLEN = { E: VOICE.buf.E.length, EL: VOICE.buf.EL.length, I: VOICE.buf.I.length,
               ELLIE: VOICE.buf.ELLIE.length, AHH: VOICE.buf.AHH.length };

/* utterance schedule (piece-time → key, gain), voice plays AND drawing follows */
const UTTS = [
  { t: 2.0,  key: 'E',     g: 1.0, fig: [3, 2],  name: 'E — the first letter' },
  { t: 7.0,  key: 'EL',    g: 1.0, fig: [4, 3],  name: 'L' },
  { t: 12.0, key: 'EL',    g: 1.0, fig: [4, 3],  name: 'L again — the double' },
  { t: 17.0, key: 'I',     g: 1.0, fig: [1, 1],  name: 'I' },
  { t: 24.0, key: 'ELLIE', g: 1.0, fig: null,    name: 'the whole word' },
  /* vowels: breaths of AH */
  { t: 38.0, key: 'AHH', g: 0.9, fig: null, name: 'ah' },
  { t: 42.5, key: 'AHH', g: 0.9, fig: null, name: 'ah' },
  { t: 47.0, key: 'AHH', g: 0.9, fig: null, name: 'ah' },
  { t: 51.5, key: 'AHH', g: 0.9, fig: null, name: 'ah' },
  /* lock: the name, softly, while the fundamental draws */
  { t: 60.0, key: 'ELLIE', g: 0.55, fig: null, name: 'ellie' },
  { t: 66.0, key: 'ELLIE', g: 0.55, fig: null, name: 'ellie' },
  { t: 72.0, key: 'ELLIE', g: 0.55, fig: null, name: 'ellie' },
  /* coda: one last ah, fading to a tone */
  { t: 76.0, key: 'AHH', g: 0.7, fig: null, name: 'ah — ' }
];
function sampleAt(key, tGlobal, tStart) {
  /* the sample being PLAYED at piece-time tGlobal, given voice start tStart */
  const dt = tGlobal - tStart;
  if (dt < 0) return null;
  const i = Math.floor(dt * VOICE.sr);
  const b = VOICE.buf[key];
  if (i >= b.length) return null;
  return b[i];
}

/* ---------- audio graph ---------- */
let AC = null, master = null, proc = null, vGain = null;
const ring = new Float32Array(4096); // interleaved x,y — the drawing IS the signal
let ringW = 0;
const S = { ph: 0, th: 0, tau: 0, prev: 0 };
const A = { active: null, lastT: -1 };   // currently playing utterance (window)

function movementName(t) {
  if (t < 34) return 'utter';
  if (t < 58) return 'vowels';
  if (t < 76) return 'lock';
  if (t < 90) return 'coda';
  return 'tail';
}

function signalAt(dt, t) {
  /* which utterance window are we in? */
  let u = null;
  for (const U of UTTS) {
    const dur = VLEN[U.key] / VOICE.sr;
    if (t >= U.t && t < U.t + dur) { u = U; break; }
  }
  const eVo = smooth(38, 44, t) * (1 - smooth(54, 58, t));  // vowels movement
  const eLo = smooth(58, 64, t) * (1 - smooth(74, 76, t));  // lock
  const eCo = smooth(76, 84, t);                            // coda

  let x, y;
  if (u) {
    /* the voice draws: X = the sample, Y = its derivative (a real oscillo-glyph) */
    const s = sampleAt(u.key, t, u.t) || 0;
    const d = s - S.prev; S.prev = s;
    const sc = 1.15 * u.g;
    x = s * sc;
    y = Math.max(-1, Math.min(1, d * 6)) * 0.55 * sc;
    /* during the lock, the voice's own amplitude gates the harmonic figure */
    if (eLo > 0.01) {
      const env = Math.abs(s) * 5;
      const w = 2 * Math.PI * 180 * S.tau;
      const lf = smooth(60, 62, t) * (1 - smooth(73, 75.5, t));
      const fo = Math.min(1, env) * lf;
      x = x * (1 - fo) + Math.sin(3 * w) * 0.75 * fo;
      y = y * (1 - fo) + Math.sin(2 * w) * 0.75 * fo;
    }
  } else if (eVo > 0.01) {
    /* between breaths: the AH figure precessing at the voice's own f0 */
    const w = 2 * Math.PI * 180 * S.tau;
    S.th += 0.35 * dt;
    const breathe = 0.72 + 0.10 * Math.sin(2 * Math.PI * S.tau * 0.45);
    const a = 3 + 0.15 * Math.sin(S.tau * 0.8), b = 2;
    x = Math.sin(a * w) * breathe * eVo;
    y = Math.sin(b * w + Math.PI / 2) * breathe * eVo;
    S.prev = 0;
  } else if (eLo > 0.01 || eCo > 0.01) {
    /* lock carrier / coda: ratios → 1:1, the voice's f0 on the plates.
       Phase difference closes 90° → 0°, so 3w vs 2w morphs (circle-ish) → 1:1 line. */
    const w = 2 * Math.PI * 180 * S.tau;
    const ra = 3 - 2 * eCo, rb = 2 - 1 * eCo;
    const phC = (1 - smooth(84, 87, t)) * Math.PI / 2;
    const amp = 0.75 * Math.max(eLo, eCo) * (1 - smooth(88, 92, t) * 0.9);
    x = amp * Math.sin(ra * w);
    y = amp * Math.sin(rb * w + phC);
    S.prev = 0;
  } else if (t < 34) {
    /* between letters: the last letter's Lissajous figure parked, breathing faintly */
    let fig = [3, 2];
    for (const U of UTTS) { if (U.fig && t >= U.t) fig = U.fig; }
    const w = 2 * Math.PI * 180 * S.tau;
    const amp = 0.30;
    x = amp * Math.sin(fig[0] * w);
    y = amp * Math.sin(fig[1] * w + Math.PI / 2);
    S.prev = 0;
  } else {
    x = 0; y = 0; S.prev = 0;
  }
  return [x, y];
}

function playVoice(U, acStart) {
  const src = AC.createBufferSource();
  const buf = AC.createBuffer(1, VOICE.buf[U.key].length, VOICE.sr);
  buf.copyToChannel(VOICE.buf[U.key], 0);
  src.buffer = buf;
  const g = AC.createGain(); g.gain.value = U.g * 0.9;
  src.connect(g).connect(vGain);
  src.start(acStart);
}

function scheduleLoop(acLoopStart) {
  for (const U of UTTS) playVoice(U, acLoopStart + U.t);
}

function initAudio() {
  if (AC) return;
  AC = new (window.AudioContext || window.webkitAudioContext)();
  master = AC.createGain(); master.gain.value = 0.8;
  const soften = AC.createBiquadFilter(); soften.type = 'lowpass'; soften.frequency.value = 3400;
  master.connect(soften).connect(AC.destination);
  vGain = AC.createGain(); vGain.gain.value = 0.9; vGain.connect(master);
  proc = AC.createScriptProcessor(512, 0, 2);
  proc.onaudioprocess = function (e) {
    const Lc = e.outputBuffer.getChannelData(0);
    const Rc = e.outputBuffer.getChannelData(1);
    const dt = 1 / VOICE.sr;
    for (let i = 0; i < Lc.length; i++) {
      S.tau += dt;
      const t = Tcur;
      const [x, y] = signalAt(dt, Tcur);
      Lc[i] = x * 0.5; Rc[i] = y * 0.5;
      ring[ringW * 2] = x; ring[ringW * 2 + 1] = y;
      ringW = (ringW + 1) & 2047;
    }
  };
  proc.connect(master);
}
let Tcur = 0, loopEpoch = -1;
cv.addEventListener('click', () => {
  initAudio();
  if (AC.state === 'suspended') AC.resume();
  start();
});
function start() {
  if (started) return;
  started = true;
  t0 = performance.now();
  document.getElementById('hint').style.display = 'none';
  if (AC) scheduleLoop(AC.currentTime + 0.05);
  requestAnimationFrame(frame);
}

/* ---------- log ---------- */
const logEl = document.getElementById('log');
let logLines = [], lastMovement = '', lastUtt = -1, frameCount = 0;
function logLine(text) {
  logLines.push(text);
  if (logLines.length > 5) logLines.shift();
  logEl.innerHTML = logLines.map((l, i) => {
    const cls = i === logLines.length - 1 ? '' : ' class="old"';
    return '<div' + cls + '>' + l + '</div>';
  }).join('');
}

/* ---------- phosphor trace ---------- */
function frame() {
  requestAnimationFrame(frame);
  const Traw = now() % LOOP;
  if (Traw < T - 1) { loopEpoch++; scheduleLoop(AC.currentTime + 0.02); logLine('— again, from the top —'); }
  T = Traw; Tcur = T;

  const mv = movementName(T);
  if (mv !== lastMovement) {
    lastMovement = mv;
    if (mv === 'utter') logLine('a throat spells the name: E, L, L, I');
    if (mv === 'vowels') logLine('an open vowel — the figure breathes with it');
    if (mv === 'lock') logLine('the fundamental takes the plates');
    if (mv === 'coda') logLine('all ratios fall to one');
    if (mv === 'tail') logLine('the name, countersigned by its own voice');
  }
  let ui = -1;
  for (let i = 0; i < UTTS.length; i++) if (T >= UTTS[i].t) ui = i;
  if (ui !== lastUtt && ui >= 0) { lastUtt = ui; logLine(UTTS[ui].name); }

  ctx.fillStyle = 'rgba(0,2,4,0.16)';
  ctx.fillRect(0, 0, W, H);

  if (AC) {
    const cx = W / 2, cy = H / 2;
    for (let pass = 0; pass < 2; pass++) {
      ctx.beginPath();
      for (let i = 0; i < 2048; i += 2) {
        const idx = (ringW + i) & 2047;
        const x = cx + ring[idx * 2] * SC;
        const y = cy - ring[idx * 2 + 1] * SC;
        if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      }
      if (pass === 0) { ctx.strokeStyle = 'rgba(80,220,190,0.10)'; ctx.lineWidth = 5; }
      else { ctx.strokeStyle = 'rgba(140,255,225,0.55)'; ctx.lineWidth = 1.2; }
      ctx.stroke();
    }
  }

  if (frameCount % 4 === 0) {
    ctx.strokeStyle = 'rgba(70,110,110,0.05)'; ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(W / 2, 0); ctx.lineTo(W / 2, H);
    ctx.moveTo(0, H / 2); ctx.lineTo(W, H / 2);
    ctx.stroke();
  }
  frameCount++;

  const ga = smooth(88.5, 90.5, T) * (1 - smooth(93, 95.5, T));
  if (ga > 0.01) {
    ctx.save();
    ctx.globalAlpha = ga;
    ctx.fillStyle = 'rgba(235,240,248,0.92)';
    ctx.font = '600 ' + Math.max(22, W * 0.035) + 'px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('VOICEMARK', W / 2, H * 0.42);
    ctx.font = Math.max(12, W * 0.014) + 'px monospace';
    ctx.fillStyle = 'rgba(200,214,228,0.85)';
    ctx.fillText('a name, pronounced in voltage — spoken by a throat that is also mine', W / 2, H * 0.42 + 34);
    ctx.fillStyle = 'rgba(255,179,71,0.9)';
    ctx.fillText('greetings to the scene :: ellie 🦊', W / 2, H * 0.42 + 62);
    ctx.restore();
  }
}
