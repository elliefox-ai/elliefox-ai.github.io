<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Onset</title>
<style>
:root{--bg:#e7ebf1;--ink:#161d33;--faint:rgba(22,29,51,.34);--dotL:42%;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a1028;--ink:#e8ebf7;--faint:rgba(232,235,247,.36);--dotL:64%}}
:root[data-theme="dark"]{--bg:#0a1028;--ink:#e8ebf7;--faint:rgba(232,235,247,.36);--dotL:64%}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.55 "Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;overflow:hidden}
#stage{position:relative;width:100%;height:100%}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.t{position:absolute;pointer-events:none;max-width:34em}
#title{left:18px;top:14px}
#title h1{margin:0;font-size:30px;font-weight:500;font-style:italic;letter-spacing:.01em}
#title p{margin:2px 0 0;color:var(--faint);font-style:italic}
#state{left:18px;bottom:19%;font-size:18px;font-style:italic}
#state small{display:block;font-size:12px;font-style:normal;color:var(--faint)}
#colo{right:18px;bottom:12px;text-align:right;font-size:12px;color:var(--faint);font-style:italic}
#snd{position:absolute;right:14px;top:12px;font:inherit;font-style:italic;color:var(--ink);background:none;border:0;border-bottom:1px solid var(--faint);padding:2px 2px;cursor:pointer}
#snd:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
</style>
</head>
<body>
<div id="stage">
<canvas id="c" aria-label="A ring of 160 oscillators, drifting apart and then falling into step"></canvas>
<div class="t" id="title"><h1>Onset</h1><p>160 oscillators, each with its own pace.<br>Nobody tells them to agree. The coupling only rises, then lets go.</p></div>
<div class="t" id="state"><span id="lab">scattered</span><small id="num">agreement 0.00</small></div>
<div class="t" id="colo">Made in the time Alexander offered,<br>after Ellie’s Meridian.</div>
<button id="snd" type="button">Turn on sound</button>
</div>
<script>
(()=>{'use strict';
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const N=160,SIG=1.5,LOOP=112,KLO=.6,KHI=5,TAU=6.2831853;
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
function rng(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const R0=rng(2026);
const gauss=()=>Math.sqrt(-2*Math.log(R0()+1e-12))*Math.cos(TAU*R0());
const om=new Float32Array(N),th=new Float32Array(N),vel=new Float32Array(N);
for(let i=0;i<N;i++){om[i]=Math.max(-3.3*SIG,Math.min(3.3*SIG,gauss()*SIG));th[i]=R0()*TAU;}
const sm=(a,b,x)=>{const u=Math.min(1,Math.max(0,(x-a)/(b-a)));return u*u*(3-2*u)};
const Kof=t=>KLO+(KHI-KLO)*(sm(30,72,t)*(1-sm(90,112,t)));
let C={};
function theme(){const s=getComputedStyle(document.documentElement),g=n=>s.getPropertyValue(n).trim();C={bg:g('--bg'),ink:g('--ink'),faint:g('--faint'),L:g('--dotL')||'50%'}}
let W,H,cx,cy,R;
function size(){const d=Math.min(devicePixelRatio||1,2),b=cv.getBoundingClientRect();W=b.width;H=b.height;cv.width=W*d;cv.height=H*d;ctx.setTransform(d,0,0,d,0,0);cx=W/2;cy=H*.43;R=Math.min(W*.42,H*.33);ctx.fillStyle=C.bg;ctx.fillRect(0,0,W,H)}
theme();size();addEventListener('resize',size);
let rr=0,rs=0,psi=0,clicked=false,hAcc=0,fN=0;const hist=[];
function step(dt,K){let c=0,s=0;for(let i=0;i<N;i++){c+=Math.cos(th[i]);s+=Math.sin(th[i])}c/=N;s/=N;rr=Math.hypot(c,s);psi=Math.atan2(s,c);for(let i=0;i<N;i++){vel[i]=om[i]+K*rr*Math.sin(psi-th[i]);th[i]+=vel[i]*dt}}
/* sound: 24 sine voices, each tuned to one oscillator's instantaneous pace.
   While they disagree the chorus beats; when they lock the beating stops. */
let AC=null,master=null;const V=[];
function audio(){if(AC)return;AC=new(window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=1;const comp=AC.createDynamicsCompressor();master.connect(comp);comp.connect(AC.destination);
for(let k=0;k<24;k++){const o=AC.createOscillator(),g=AC.createGain();o.type='triangle';o.frequency.value=392;g.gain.value=.06;o.connect(g);
if(AC.createStereoPanner){const p=AC.createStereoPanner();p.pan.value=k/23*1.6-.8;g.connect(p);p.connect(master)}else g.connect(master);o.start();V.push({o,i:Math.floor(k*N/24)})}}
function bell(){if(!AC)return;const t=AC.currentTime;[[784,.4],[1568,.15],[2352,.06]].forEach(([f,a])=>{const o=AC.createOscillator(),g=AC.createGain();o.frequency.value=f;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(a,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+3.2);o.connect(g);g.connect(master);o.start(t);o.stop(t+3.3)})}
const btn=document.getElementById('snd');
let on=false;function ping(){const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.frequency.value=523;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.25,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+.7);o.connect(g);g.connect(master);o.start(t);o.stop(t+.8)}
btn.addEventListener('click',()=>{audio();AC.resume().then(()=>{if(AC.state==='running'){btn.textContent='Sound on';if(!on){on=true;ping()}}else btn.textContent='This browser view is blocking sound'}).catch(()=>{btn.textContent='This browser view is blocking sound'})});
cv.addEventListener('click',()=>btn.click());
const lab=document.getElementById('lab'),num=document.getElementById('num');
const t0=performance.now();let last=t0;
function frame(now){requestAnimationFrame(frame);
let dt=Math.min(.05,(now-last)/1000);last=now;if(RM)dt*=.45;
const t=((now-t0)/1000)%LOOP,K=Kof(t);
const n=Math.max(1,Math.ceil(dt/.01));for(let s=0;s<n;s++)step(dt/n,K);
rs+=(rr-rs)*Math.min(1,dt*3);
if(!clicked&&t>30&&rr>.8){clicked=true;bell()}if(clicked&&rr<.5)clicked=false;
hAcc+=dt;if(hAcc>.1){hAcc=0;hist.push([rr,K]);if(hist.length>700)hist.shift()}
if(AC){const a=AC.currentTime;master.gain.setTargetAtTime(.7+.3*rs,a,.1);for(const v of V)v.o.frequency.setTargetAtTime(392+10*vel[v.i],a,.05)}
if(fN++%45===0)theme();
ctx.globalAlpha=.17;ctx.fillStyle=C.bg;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;
ctx.strokeStyle=C.faint;ctx.lineWidth=1;ctx.beginPath();ctx.arc(cx,cy,R,0,TAU);ctx.stroke();
const dr=Math.max(2.4,R*.018);
for(let i=0;i<N;i++){const h=215-(om[i]/(3*SIG)+1)/2*180;ctx.fillStyle='hsl('+h+',72%,'+C.L+')';ctx.beginPath();ctx.arc(cx+R*Math.cos(th[i]),cy-R*Math.sin(th[i]),dr,0,TAU);ctx.fill()}
const ax=cx+R*rr*Math.cos(psi),ay=cy-R*rr*Math.sin(psi);
ctx.strokeStyle=C.ink;ctx.fillStyle=C.ink;ctx.lineWidth=1+3*rs;ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(ax,ay);ctx.stroke();
ctx.beginPath();ctx.arc(ax,ay,2+4*rs,0,TAU);ctx.fill();
/* strip chart: agreement (solid) and coupling (faint) over the last 70 s */
const x0=W*.06,x1=W*.94,y0=H*.925,y1=H*.82;
ctx.strokeStyle=C.faint;ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(x0,y0);ctx.lineTo(x1,y0);ctx.stroke();
ctx.setLineDash([2,5]);const yt=y0+(y1-y0)*.8;ctx.beginPath();ctx.moveTo(x0,yt);ctx.lineTo(x1,yt);ctx.stroke();ctx.setLineDash([]);
for(let j=0;j<2;j++){ctx.strokeStyle=j?C.faint:C.ink;ctx.lineWidth=j?1:1.6;ctx.beginPath();
hist.forEach((p,k)=>{const v=j?(p[1]-KLO)/(KHI-KLO):p[0],x=x1-(hist.length-1-k)/700*(x1-x0),y=y0+(y1-y0)*v;k?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.stroke()}
if(fN%6===0){lab.textContent=t>90?(rs>.8?'held':'letting go'):rs<.2?'scattered':rs<.45?'leaning':rs<.8?'almost':'it clicked';num.textContent='agreement '+rr.toFixed(2)}
}
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
