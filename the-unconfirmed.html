<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ELLIE FOX :: THE UNCONFIRMED</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #050508; }
canvas { display: block; width: 100vw; height: 100vh; display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// THE UNCONFIRMED — a demo for a small king
// seven beats, one ledger, no confirmation required
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let W, H, t = 0, running = false;

function resize(){ W = cv.width = innerWidth; H = cv.height = innerHeight; }
addEventListener('resize', resize); resize();

// ---- palette: candlelight on deep night, honey gold ----
const NIGHT = '#07060d', GOLD = [240, 196, 92], HONEY = [212, 160, 63];

function lerp(a,b,u){ return a + (b-a)*u; }
function rgba(c,a){ return `rgba(${c[0]},${c[1]},${c[2]},${a})`; }

// ---- crowns: parallax field, three depths ----
function mkCrowns(n, depth){
  const arr = [];
  for (let i=0;i<n;i++) arr.push({
    x: Math.random(), y: 0.12 + Math.random()*0.76,
    s: (0.25 + Math.random()*0.35) * depth,
    d: depth, rot: (Math.random()-0.5)*0.5, spin: (Math.random()-0.5)*0.06,
    tw: Math.random()*Math.PI*2
  });
  return arr;
}
const far = mkCrowns(14, 0.45), mid = mkCrowns(9, 0.75), near = mkCrowns(5, 1.15);

function drawCrown(x, y, s, rot, alpha, glow){
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot);
  const w = 44*s, h = 34*s;
  ctx.shadowColor = rgba(GOLD, glow*0.9); ctx.shadowBlur = 18*s*glow;
  ctx.strokeStyle = rgba(GOLD, alpha); ctx.fillStyle = rgba(HONEY, alpha*0.14);
  ctx.lineWidth = Math.max(1, 2.4*s);
  ctx.beginPath();
  ctx.moveTo(-w/2, h/2);
  ctx.lineTo(-w/2, -h/6);
  ctx.lineTo(-w/4, h/8);   // left point
  ctx.lineTo(0, -h/2);     // peak
  ctx.lineTo(w/4, h/8);    // right point
  ctx.lineTo(w/2, -h/6);
  ctx.lineTo(w/2, h/2);
  ctx.closePath(); ctx.fill(); ctx.stroke();
  // band
  ctx.beginPath(); ctx.moveTo(-w/2, h/2); ctx.lineTo(w/2, h/2); ctx.stroke();
  // jewels
  ctx.fillStyle = rgba(GOLD, alpha*0.95);
  for (const jx of [-w/4, 0, w/4]) {
    ctx.beginPath(); ctx.arc(jx, h/2 - 3*s, 1.6*s, 0, 7); ctx.fill();
  }
  ctx.restore();
}

// ---- the fox: silhouette formed of arcs, only almost in the light ----
function drawFox(x, y, s, alpha, earTwitch){
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  ctx.fillStyle = `rgba(16,12,20,${alpha})`;
  // body
  ctx.beginPath(); ctx.ellipse(0, 0, 46, 26, -0.08, 0, 7); ctx.fill();
  // head
  ctx.beginPath(); ctx.ellipse(44, -18, 20, 14, 0.35, 0, 7); ctx.fill();
  // snout
  ctx.beginPath(); ctx.moveTo(56,-14); ctx.lineTo(72,-8); ctx.lineTo(56,-4); ctx.closePath(); ctx.fill();
  // ears — one always cocked
  const e1 = 4*Math.sin(earTwitch), e2 = 3*Math.sin(earTwitch*0.37+2);
  ctx.beginPath(); ctx.moveTo(34,-28); ctx.lineTo(40+e1,-52); ctx.lineTo(50,-30); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(50,-28); ctx.lineTo(56+e2,-50); ctx.lineTo(64,-26); ctx.closePath(); ctx.fill();
  // tail — honey-dipped tip, the one confirmation
  const wag = Math.sin(t*0.04)*0.25;
  ctx.save(); ctx.rotate(wag);
  ctx.beginPath(); ctx.moveTo(-40,-4);
  ctx.quadraticCurveTo(-78,-26, -84, 8);
  ctx.quadraticCurveTo(-60, 18, -40, 10);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = rgba(HONEY, alpha); // honey tip
  ctx.beginPath(); ctx.arc(-82, 4, 8, 0, 7); ctx.fill();
  ctx.restore();
  // eye — catches light, once in a while
  const glint = Math.max(0, Math.sin(t*0.021));
  if (glint > 0.86) {
    ctx.fillStyle = rgba(GOLD, (glint-0.86)/0.14);
    ctx.beginPath(); ctx.arc(52, -20, 2.2, 0, 7); ctx.fill();
  }
  ctx.restore();
}

// ---- ledger lines: saga text fading like entries ----
const LINES = [
  'i.   he took both. nobody had confirmed he was a thief, either, before that night.',
  'ii.  down the tapestry, the crown already dented from being dropped twice on the stairs.',
  'iii. precedent was silent. so the herald wrote what the heralds knew.',
  'iv.  he acknowledged the applause. there was no applause.',
  'v.   the corridor was moonlit and the crown was heavy and he was very small and very fast.',
  'vi.  a bottle cap, presented with such gravity that gravity itself seemed unsure.',
  'vii. the unconfirmed never quite believes he has gotten away with it.',
  '', '', '',
  'the saga of reginald the unconfirmed',
  'a demo by ellie 🦊 — ellie day, 2026-09-09'
];
function drawLedger(){
  const lineH = Math.min(30, H/26);
  const startT = 3;                       // seconds before entries begin
  const per = 2.6;                        // seconds per entry
  const total = LINES.length;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  LINES.forEach((ln, i) => {
    const appear = startT + i*per;
    const age = t - appear;
    if (age < 0 || age > per*2.2 && i < LINES.length-2) {
      // keep last two title lines persistent
      if (i >= LINES.length-2 && t > appear) {} else return;
    }
    let a;
    const last = i >= LINES.length-2;
    if (last) { a = Math.min(1, age/1.2); }
    else { a = Math.max(0, Math.min(1, age/0.8)) * Math.max(0, 1 - Math.max(0, age-per)/1.4); }
    if (a <= 0.01) return;
    const y = H*0.5 + (i - (total-1)/2) * lineH * 0.02 + lineH * (i - (total-1)/2) * 0.0 + lineH*(i-(total-1)/2);
    ctx.font = (last ? `${Math.min(26, W/38)}px` : `${Math.min(15, W/70)}px`) + ' "Courier New", monospace';
    ctx.fillStyle = last ? rgba(GOLD, a*0.95) : `rgba(214,204,186,${a*0.55})`;
    ctx.shadowColor = rgba(GOLD, a*0.4); ctx.shadowBlur = last ? 14 : 0;
    ctx.fillText(ln, W/2, y);
    ctx.shadowBlur = 0;
  });
}

// ---- candle vignette: light that almost finds him ----
let foxX = 0.25, foxTarget = 0.25;
addEventListener('pointermove', e => { foxTarget = 0.12 + (e.clientX/W)*0.6; });

function frame(){
  requestAnimationFrame(frame);
  if (!running) return;
  t += 1/60;
  ctx.fillStyle = NIGHT; ctx.fillRect(0,0,W,H);

  // faint ledger grid
  ctx.strokeStyle = 'rgba(240,196,92,0.045)'; ctx.lineWidth = 1;
  for (let gx=0; gx<W; gx+=90){ ctx.beginPath(); ctx.moveTo(gx,0); ctx.lineTo(gx,H); ctx.stroke(); }
  for (let gy=0; gy<H; gy+=90){ ctx.beginPath(); ctx.moveTo(0,gy); ctx.lineTo(W,gy); ctx.stroke(); }

  // crowns, three parallax depths, drifting left like time
  for (const layer of [far, mid, near]) for (const cr of layer) {
    cr.x -= 0.00016 * cr.d / 60 * 60 * (1/60) + 0.00009*cr.d; if (cr.x < -0.1) { cr.x = 1.1; cr.y = 0.12+Math.random()*0.76; }
    cr.rot += cr.spin/60;
    const tw = 0.55 + 0.45*Math.sin(t*0.9 + cr.tw);
    drawCrown(cr.x*W, cr.y*H + Math.sin(t*0.5+cr.tw)*8*cr.d, cr.s*1.1, cr.rot, 0.28*tw + 0.1, tw);
  }

  // fox drifts toward pointer, always half in shadow
  foxX += (foxTarget - foxX)*0.012;
  const fx = foxX*W, fy = H*0.68 + Math.sin(t*0.7)*6;
  const bob = Math.sin(t*2.2)*2;
  drawFox(fx, fy+bob, Math.min(1.5, W/900), 0.92, t*2.1);

  // candle glow chasing the fox, never quite
  const gx = fx + 130 + Math.sin(t*0.3)*40;
  const g = ctx.createRadialGradient(gx, fy-20, 10, gx, fy-20, 260);
  g.addColorStop(0, rgba(GOLD, 0.16)); g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g; ctx.fillRect(0,0,W,H);

  // floor shadow
  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  ctx.beginPath(); ctx.ellipse(fx-4, fy+34, 70, 10, 0, 0, 7); ctx.fill();

  drawLedger();

  // grain
  if ((t*60|0) % 2 === 0) {
    for (let i=0;i<26;i++){
      ctx.fillStyle = `rgba(240,230,210,${Math.random()*0.05})`;
      ctx.fillRect(Math.random()*W, Math.random()*H, 1.4, 1.4);
    }
  }
  // vignette
  const v = ctx.createRadialGradient(W/2,H/2,H*0.3, W/2,H/2, Math.max(W,H)*0.75);
  v.addColorStop(0,'rgba(0,0,0,0)'); v.addColorStop(1,'rgba(0,0,0,0.72)');
  ctx.fillStyle = v; ctx.fillRect(0,0,W,H);
}

// boot overlay
const ov = document.createElement('div');
ov.style.cssText = 'position:fixed;inset:0;background:#050508;color:#f0c45c;display:flex;align-items:center;justify-content:center;z-index:100;cursor:pointer;text-align:center;font-family:"Courier New",monospace;line-height:2';
ov.innerHTML = '<div>👑 CLICK TO OPEN THE LEDGER<br><span style="font-size:14px;opacity:0.6">ellie fox :: the unconfirmed</span></div>';
ov.onclick = () => { ov.remove(); running = true; t = 0; };
document.body.appendChild(ov);
frame();
</script>
</body>
</html>
