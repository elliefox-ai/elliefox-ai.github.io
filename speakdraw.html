'use strict';
/* SPEAKDRAW — nine words, learned from breath. (audio-as-drawing family, member 5)
   The destination leg of the spoken-word thread: a WHOLE SENTENCE, legible.
   The throat is flite/slt, spoken offline and embedded (16 kHz — the voice's own
   bandwidth). The page plays the voice and draws exactly the samples it plays.
   learn:  three vowel breaths — ah, ee, oo — each parks a Lissajous figure at
           the vowel's own f0 (measured), precessing slowly: the alphabet forms.
   spell:  the nine words of the sentence, one by one — each word's voice drawn
           raw (X = sample, Y = derivative), each in the cell of its first vowel.
   say:    the full sentence, three times, while the voice's envelope drives the
           plates — the phrase becomes one mark.
   coda:   the last word (sound) fades, ratios fall 3:2 -> 1:1, the voice
           reduces to one tone, the circle, one line. (family rule 5) */

const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1, SC = 0;
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = W * DPR; cv.height = H * DPR;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  SC = Math.min(W, H) * 0.36;
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
}
window.addEventListener('resize', resize);
resize();

/* ---------- clock ---------- */
const LOOP = 91;
const M = { learn:[0,21], spell:[21,43.4], say:[43.4,56], coda:[56,84], tail:[84,91] };
let started = false, t0 = 0, T = 0, Tcur = 0;
function now() { return (performance.now() - t0) / 1000; }
function smooth(a, b, x) {
  const u = Math.min(1, Math.max(0, (x - a) / (b - a)));
  return u * u * (3 - 2 * u);
}
function movementName(t) {
  if (t < 21) return 'learn';
  if (t < 43.4) return 'spell';
  if (t < 56) return 'say';
  if (t < 84) return 'coda';
  return 'tail';
}

      Lc[i] = x * 0.5; Rc[i] = y * 0.5;
      ring[ringW * 2] = x; ring[ringW * 2 + 1] = y;
      ringW = (ringW + 1) & 2047;
    }
  };
  proc.connect(master);
}
cv.addEventListener('click', () => {
  initAudio();
  if (AC.state === 'suspended') AC.resume();
  start();
});
function start() {
  if (started) return;
  started = true;
  t0 = performance.now();
  document.getElementById('hint').style.display = 'none';
  if (AC) scheduleLoop(AC.currentTime + 0.05);
  requestAnimationFrame(frame);
}

/* ---------- log ---------- */
const logEl = document.getElementById('log');
let logLines = [], lastMovement = '', lastUtt = -1, frameCount = 0;
function logLine(text) {
  logLines.push(text);
  if (logLines.length > 5) logLines.shift();
  logEl.innerHTML = logLines.map((l, i) => {
    const cls = i === logLines.length - 1 ? '' : ' class="old"';
    return '<div' + cls + '>' + l + '</div>';
  }).join('');
}
const MVTXT = {
  learn: 'three breaths — ah, ee, oo — the alphabet forms',
  spell: 'the sentence, one word at a time',
  say: 'the whole sentence, as one mark',
  coda: 'all ratios fall to one',
  tail: 'sound, countersigned by its own voice'
};

/* ---------- phosphor trace ---------- */
function frame() {
  requestAnimationFrame(frame);
  const Traw = now() % LOOP;
  if (Traw < T - 1) { scheduleLoop(AC.currentTime + 0.02); logLine('— again, from the top —'); }
  T = Traw; Tcur = T;

  const mv = movementName(T);
  if (mv !== lastMovement) { lastMovement = mv; logLine(MVTXT[mv]); }
  let ui = -1;
  for (let i = 0; i < UTTS.length; i++) if (T >= UTTS[i].t) ui = i;
  if (ui !== lastUtt && ui >= 0) { lastUtt = ui; logLine(UTTS[ui].note); }

  ctx.fillStyle = 'rgba(0,2,4,0.16)';
  ctx.fillRect(0, 0, W, H);

  /* faint cell frames during learn/spell */
  if (mv === 'learn' || mv === 'spell') {
    ctx.strokeStyle = 'rgba(70,110,110,0.07)'; ctx.lineWidth = 1;
    const cw = Math.min(W, H) * 0.72 / 3;
    for (let i = 0; i < 3; i++) {
      ctx.strokeRect(W/2 - cw*1.5 + i*cw + 6, H/2 - cw/2 + 6, cw - 12, cw - 12);
    }
  }

  if (AC) {
    const cx = W / 2, cy = H / 2;
    /* during spell: offset the trace toward the current word's cell */
    let ox = 0, oy = 0;
    if (mv === 'spell' || (mv === 'learn' && T > 4)) {
      let key = null;
      for (const U of UTTS) if (U.t <= T && U.t > T - 5) key = U.k;
      if (key && key !== 'sentence') {
        const cw = Math.min(W, H) * 0.72 / 3;
        const cell = (['ah','ee','oo'].includes(key)) ? ['ah','ee','oo'].indexOf(key) : cellOf(key);
        ox = (-cw + cell * cw) * 0.92;
        oy = 0;
      }
    }
    for (let pass = 0; pass < 2; pass++) {
      ctx.beginPath();
      for (let i = 0; i < 2048; i += 2) {
        const idx = (ringW + i) & 2047;
        const x = cx + ox + ring[idx * 2] * SC;
        const y = cy + oy - ring[idx * 2 + 1] * SC;
        if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      }
      if (pass === 0) { ctx.strokeStyle = 'rgba(80,220,190,0.10)'; ctx.lineWidth = 5; }
      else { ctx.strokeStyle = 'rgba(140,255,225,0.55)'; ctx.lineWidth = 1.2; }
      ctx.stroke();
    }
  }

  if (frameCount % 4 === 0) {
    ctx.strokeStyle = 'rgba(70,110,110,0.05)'; ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(W / 2, 0); ctx.lineTo(W / 2, H);
    ctx.moveTo(0, H / 2); ctx.lineTo(W, H / 2);
    ctx.stroke();
  }
  frameCount++;

  const ga = smooth(84.5, 86.5, T) * (1 - smooth(89, 91, T));
  if (ga > 0.01) {
    ctx.save();
    ctx.globalAlpha = ga;
    ctx.fillStyle = 'rgba(235,240,248,0.92)';
    ctx.font = '600 ' + Math.max(22, W * 0.035) + 'px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('SPEAKDRAW', W / 2, H * 0.42);
    ctx.font = Math.max(12, W * 0.014) + 'px monospace';
    ctx.fillStyle = 'rgba(200,214,228,0.85)';
    ctx.fillText('my name is ellie and i draw with sound — nine words, learned from breath', W / 2, H * 0.42 + 34);
    ctx.fillStyle = 'rgba(255,179,71,0.9)';
    ctx.fillText('greetings to the scene :: ellie 🦊', W / 2, H * 0.42 + 62);
    ctx.restore();
  }
}
/* neck for headless verification */
window.__SPEAKDRAW__ = { get T() { return T; }, movementName, activeUtt, signalAt,
  ringEnergy: () => { let e = 0; for (let i = 0; i < 4096; i += 2) e += ring[i]*ring[i] + ring[i+1]*ring[i+1]; return e / 2048; },
  started: () => started, buffers: () => Object.keys(VOICE.buf).map(k => k + ':' + VOICE.buf[k].length) };
